<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hindu-Arabic to Egyptian Numerals</title>

  <style>
    :root {
      --page-bg: #f4f7fb;
      --card: #ffffff;
      --panel: #f8fafc;

      --text: #172033;
      --muted: #667085;

      --border: #dbe2ea;
      --border-dark: #cbd5e1;

      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #eff6ff;

      --green: #166534;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;

      --red: #991b1b;
      --red-bg: #fff7f7;
      --red-border: #fecaca;

      --shadow:
        0 1px 2px rgba(16, 24, 40, 0.04),
        0 4px 14px rgba(16, 24, 40, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--page-bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1050px, calc(100% - 28px));
      margin: 28px auto;
    }

    .card {
      padding: 22px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow: var(--shadow);
    }

    .prompt {
      text-align: center;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .number {
      margin: 18px 0 6px;

      text-align: center;

      color: var(--text);

      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
    }

    .subprompt {
      text-align: center;

      color: var(--muted);

      font-size: 0.84rem;
      line-height: 1.45;
    }

    .answer-label {
      margin: 20px 0 9px;

      text-align: center;

      font-weight: 750;
    }

    .answer {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;
      flex-wrap: wrap;

      min-height: 122px;

      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--panel);
    }

    .empty {
      text-align: center;

      color: var(--muted);

      font-size: 0.84rem;
      line-height: 1.45;
    }

    .symbol-group {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 2px;
      flex-wrap: wrap;

      padding: 6px 7px;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: var(--card);
    }

    .palette {
      margin-top: 16px;
      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: var(--card);
    }

    .palette-title {
      margin-bottom: 10px;

      text-align: center;

      color: var(--muted);

      font-size: 0.78rem;
      font-weight: 750;
    }

    .symbol-buttons {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 8px;
    }

    .symbol-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 5px;

      min-width: 0;
      min-height: 100px;

      padding: 8px 5px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--card);
      color: var(--text);

      font-weight: 750;

      cursor: pointer;
    }

    .symbol-button:hover {
      background: var(--panel);
    }

    .symbol-value-label {
      color: var(--muted);

      font-size: 0.76rem;
    }

    .edit-actions,
    .main-actions {
      display: flex;
      justify-content: center;

      gap: 8px;
      flex-wrap: wrap;
    }

    .edit-actions {
      margin-top: 10px;
    }

    .main-actions {
      margin-top: 18px;
    }

    button {
      min-height: 42px;

      border-radius: 9px;

      font-weight: 700;

      cursor: pointer;
    }

    .primary {
      padding: 8px 15px;

      border: 1px solid var(--blue);

      background: var(--blue);
      color: white;
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .secondary {
      padding: 8px 15px;

      border: 1px solid var(--border);

      background: var(--card);
      color: var(--text);
    }

    .secondary:hover {
      background: var(--panel);
    }

    .feedback {
      display: none;

      margin-top: 16px;

      border-radius: 11px;

      overflow: hidden;

      line-height: 1.45;
    }

    .feedback.correct {
      display: block;

      padding: 14px 16px;

      border: 1px solid var(--green-border);

      background: var(--green-bg);
      color: var(--green);
    }

    .feedback.incorrect {
      display: block;

      border: 1px solid var(--red-border);

      background: var(--red-bg);
      color: var(--text);
    }

    .feedback-head {
      padding: 14px 16px;

      color: var(--red);
    }

    .explanation {
      padding: 15px 16px;

      border-top: 1px solid var(--red-border);

      background: var(--card);
    }

    .explanation-title {
      margin-bottom: 10px;

      font-weight: 750;
    }

    .correct-answer {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;
      flex-wrap: wrap;

      min-height: 100px;

      padding: 10px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--panel);
    }

    .math-box {
      margin-top: 10px;

      padding: 11px;

      border-radius: 9px;

      background: var(--blue-soft);

      text-align: center;

      font-weight: 750;
      line-height: 1.55;
    }

    svg {
      display: block;
      overflow: visible;

      color: var(--text);
    }

    @media (max-width: 650px) {

      .app {
        width: min(100% - 18px, 1050px);
        margin: 18px auto;
      }

      .card {
        padding: 15px 12px;
      }

      .symbol-buttons {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .number {
        font-size: 2.5rem;
      }

    }
  </style>
</head>

<body>

<main class="app">

  <section class="card">

    <div class="prompt">
      Write this Hindu-Arabic numeral as an Egyptian numeral.
    </div>

    <div
      id="problemNumber"
      class="number">
      24,315
    </div>

    <div class="subprompt">
      Egyptian numerals are additive. Click each symbol as many times as you need.
    </div>

    <div class="answer-label">
      Your Egyptian numeral
    </div>

    <div
      id="answerArea"
      class="answer">
    </div>

    <div class="palette">

      <div class="palette-title">
        Click a symbol to add it
      </div>

      <div
        id="symbolButtons"
        class="symbol-buttons">
      </div>

      <div class="edit-actions">

        <button
          id="undoButton"
          class="secondary"
          type="button">
          Undo Last Symbol
        </button>

        <button
          id="clearButton"
          class="secondary"
          type="button">
          Clear Answer
        </button>

      </div>

    </div>

    <div class="main-actions">

      <button
        id="checkButton"
        class="primary"
        type="button">
        Check Answer
      </button>

      <button
        id="nextButton"
        class="secondary"
        type="button">
        Next Question
      </button>

    </div>

    <div
      id="feedback"
      class="feedback"
      aria-live="polite">
    </div>

  </section>

</main>


<script>
(() => {

  const problemNumber =
    document.getElementById("problemNumber");

  const answerArea =
    document.getElementById("answerArea");

  const symbolButtons =
    document.getElementById("symbolButtons");

  const feedback =
    document.getElementById("feedback");

  const undoButton =
    document.getElementById("undoButton");

  const clearButton =
    document.getElementById("clearButton");

  const checkButton =
    document.getElementById("checkButton");

  const nextButton =
    document.getElementById("nextButton");


  const values = [
    1000000,
    100000,
    10000,
    1000,
    100,
    10,
    1
  ];


  const labels = [
    "1,000,000",
    "100,000",
    "10,000",
    "1,000",
    "100",
    "10",
    "1"
  ];


  let targetNumber = 1;

  let previousNumber = null;

  let history = [];

  const counts = {};


  values.forEach(
    value => {
      counts[value] = 0;
    }
  );


  function symbolSvg(
    value,
    size = 56
  ) {

    const common = `
      width="${size}"
      height="${size}"
      viewBox="0 0 64 64"
      aria-hidden="true"
    `;


    const line = `
      stroke="currentColor"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    `;


    /* 1 */
    if (value === 1) {

      return `
        <svg ${common}>

          <path
            d="M32 9 L32 55"
            ${line}
            stroke-width="3.3">
          </path>

        </svg>
      `;
    }


    /* 10 */
    if (value === 10) {

      return `
        <svg ${common}>

          <path
            d="
              M18 44
              C18 32 19 24 23 19
              C27 14 37 14 42 19
              C46 24 47 32 47 44
            "
            ${line}
            stroke-width="3.3">
          </path>

          <path
            d="
              M18 44 L18 49
              M47 44 L47 49
            "
            ${line}
            stroke-width="3.3">
          </path>

        </svg>
      `;
    }


    /* 100 */
    if (value === 100) {

      return `
        <svg ${common}>

          <path
            d="
              M41 19
              C34 13 24 14 19 21
              C14 29 17 39 25 43
              C33 47 42 43 44 36
              C46 29 40 24 34 25
              C29 26 27 31 29 35
              C31 39 36 39 39 36
            "
            ${line}
            stroke-width="3.2">
          </path>

        </svg>
      `;
    }


    /* 1,000 */
    if (value === 1000) {

      return `
        <svg ${common}>

          <path
            d="
              M31 10
              C39 9 46 12 49 17
              C45 20 41 23 37 24
              C40 27 44 29 47 31
              C42 34 36 35 31 33
              C24 31 20 26 20 20
              C20 14 24 11 31 10
              Z
            "
            ${line}
            stroke-width="3">
          </path>

          <path
            d="M31 33 L31 49"
            ${line}
            stroke-width="3.3">
          </path>

          <path
            d="
              M31 45 L24 39
              M31 45 L38 39
            "
            ${line}
            stroke-width="3">
          </path>

          <path
            d="
              M22 55
              C22 49 26 45 31 45
              C36 45 40 49 40 55
              Z
            "
            ${line}
            stroke-width="3">
          </path>

          <path
            d="M22 55 L40 55"
            ${line}
            stroke-width="3.2">
          </path>

        </svg>
      `;
    }


    /*
      10,000
      Pointing finger
      Straight bottom with no notch
    */
    if (value === 10000) {

      return `
        <svg ${common}>

          <path
            d="
              M25 55
              L25 22
              L37 7
              L43 12
              L33 26
              L33 55
              Z
            "
            ${line}
            stroke-width="3">
          </path>

          <path
            d="
              M35 11
              L40 15
            "
            ${line}
            stroke-width="2.3">
          </path>

        </svg>
      `;
    }


    /* 100,000 */
    if (value === 100000) {

      return `
        <svg ${common}>

          <path
            d="
              M12 27
              C18 19 29 17 39 20
              C47 22 52 28 51 34
              C50 40 43 43 36 42
              C28 41 22 37 19 33
              C16 31 14 29 12 27
              Z
            "
            fill="currentColor"
            stroke="none">
          </path>

          <ellipse
            cx="43"
            cy="25"
            rx="2"
            ry="1.8"
            fill="white">
          </ellipse>

          <path
            d="
              M22 35
              C20 39 18 44 17 49
            "
            ${line}
            stroke-width="3.2">
          </path>

          <path
            d="M18 49 L12 49"
            ${line}
            stroke-width="3.2">
          </path>

          <path
            d="
              M35 41
              C41 41 47 39 51 35
            "
            ${line}
            stroke-width="3">
          </path>

          <path
            d="
              M47 36
              C51 39 54 42 56 46
            "
            ${line}
            stroke-width="3">
          </path>

        </svg>
      `;
    }


    /* 1,000,000 */
    return `
      <svg ${common}>

        <path
          d="
            M32 13
            C28 13 25 16 25 20
            C25 24 28 27 32 27
            C36 27 39 24 39 20
            C39 16 36 13 32 13
            Z
          "
          ${line}
          stroke-width="3">
        </path>

        <path
          d="M32 27 L32 43"
          ${line}
          stroke-width="3.2">
        </path>

        <path
          d="
            M31 31
            L19 31
            L15 17
          "
          ${line}
          stroke-width="3.2">
        </path>

        <path
          d="
            M33 31
            L45 31
            L49 17
          "
          ${line}
          stroke-width="3.2">
        </path>

        <path
          d="
            M15 17 L10 11
            M15 17 L16 9
            M15 17 L20 11
          "
          ${line}
          stroke-width="2.7">
        </path>

        <path
          d="
            M49 17 L44 11
            M49 17 L48 9
            M49 17 L54 11
          "
          ${line}
          stroke-width="2.7">
        </path>

        <path
          d="
            M32 43
            L22 49
            L16 49
          "
          ${line}
          stroke-width="3.2">
        </path>

        <path
          d="
            M32 43
            L42 49
            L49 49
          "
          ${line}
          stroke-width="3.2">
        </path>

        <path
          d="
            M16 49 L12 55
            M49 49 L53 55
          "
          ${line}
          stroke-width="2.8">
        </path>

      </svg>
    `;
  }


  function weightedDigit() {

    if (Math.random() < 0.88) {

      return Math.floor(
        Math.random() * 6
      );
    }

    return (
      6 +
      Math.floor(
        Math.random() * 4
      )
    );
  }


  function generateNumber() {

    if (Math.random() < 0.02) {
      return 1000000;
    }

    if (Math.random() < 0.01) {
      return 0;
    }

    const random =
      Math.random();

    let length;

    if (random < 0.12) {
      length = 2;
    }
    else if (random < 0.36) {
      length = 3;
    }
    else if (random < 0.64) {
      length = 4;
    }
    else if (random < 0.84) {
      length = 5;
    }
    else {
      length = 6;
    }

    const digits = [];

    let firstDigit;

    do {

      firstDigit =
        weightedDigit();

    } while (
      firstDigit === 0
    );

    digits.push(
      firstDigit
    );

    for (
      let index = 1;
      index < length;
      index++
    ) {

      digits.push(
        weightedDigit()
      );
    }

    return Number(
      digits.join("")
    );
  }


  function getTargetCounts() {

    const result = {};

    values.forEach(
      value => {
        result[value] = 0;
      }
    );

    let remaining =
      targetNumber;

    for (
      const value
      of values
    ) {

      result[value] =
        Math.floor(
          remaining / value
        );

      remaining %=
        value;
    }

    return result;
  }


  function renderGroups(
    sourceCounts,
    showEmpty = true
  ) {

    const groups = [];

    for (
      const value
      of values
    ) {

      const count =
        sourceCounts[value] || 0;

      if (
        count > 0
      ) {

        let symbols = "";

        for (
          let index = 0;
          index < count;
          index++
        ) {

          symbols +=
            symbolSvg(
              value,
              46
            );
        }

        groups.push(
          `
            <div
              class="symbol-group"
              title="${count} × ${value.toLocaleString("en-US")}">

              ${symbols}

            </div>
          `
        );
      }
    }

    if (
      groups.length === 0 &&
      showEmpty
    ) {

      if (
        targetNumber === 0
      ) {

        return `
          <div class="empty">

            <strong>
              No symbols
            </strong>

            <br>

            Leave the answer empty for 0.

          </div>
        `;
      }

      return `
        <div class="empty">

          Click the Egyptian symbols below
          to build your answer.

        </div>
      `;
    }

    return groups.join("");
  }


  function renderAnswer() {

    answerArea.innerHTML =
      renderGroups(
        counts,
        true
      );
  }


  function renderSymbolButtons() {

    symbolButtons.innerHTML =
      values
        .map(
          (
            value,
            index
          ) => {

            return `
              <button
                type="button"
                class="symbol-button"
                data-value="${value}">

                ${symbolSvg(
                  value,
                  52
                )}

                <span class="symbol-value-label">
                  ${labels[index]}
                </span>

              </button>
            `;
          }
        )
        .join("");


    const buttons =
      [
        ...symbolButtons.querySelectorAll(
          ".symbol-button"
        )
      ];


    buttons.forEach(
      button => {

        button.addEventListener(
          "click",

          function () {

            const value =
              Number(
                button.dataset.value
              );

            if (
              counts[value] >= 9
            ) {

              feedback.className =
                "feedback incorrect";

              feedback.innerHTML =
                `
                  <div class="feedback-head">

                    <strong>
                      You never need more than
                      9 of the same symbol.
                    </strong>

                  </div>
                `;

              return;
            }

            counts[value]++;

            history.push(
              value
            );

            clearFeedback();

            renderAnswer();
          }
        );
      }
    );
  }


  function clearFeedback() {

    feedback.className =
      "feedback";

    feedback.innerHTML =
      "";
  }


  function undoLastSymbol() {

    const value =
      history.pop();

    if (
      value === undefined
    ) {
      return;
    }

    counts[value]--;

    clearFeedback();

    renderAnswer();
  }


  function clearAnswer() {

    values.forEach(
      value => {
        counts[value] = 0;
      }
    );

    history = [];

    clearFeedback();

    renderAnswer();
  }


  function buildExplanation() {

    const correctCounts =
      getTargetCounts();

    const terms = [];

    for (
      const value
      of values
    ) {

      if (
        correctCounts[value]
      ) {

        terms.push(
          `${correctCounts[value]} × ${value.toLocaleString("en-US")}`
        );
      }
    }


    const correctVisual =
      targetNumber === 0

        ? `
            <div class="empty">
              <strong>
                No symbols
              </strong>
            </div>
          `

        : renderGroups(
            correctCounts,
            false
          );


    return `
      <div class="explanation">

        <div class="explanation-title">
          The correct Egyptian numeral is:
        </div>

        <div class="correct-answer">
          ${correctVisual}
        </div>

        <div class="math-box">

          ${
            targetNumber === 0
              ? "0"
              : terms.join(" + ")
          }

          =

          ${targetNumber.toLocaleString(
            "en-US"
          )}

        </div>

      </div>
    `;
  }


  function checkAnswer() {

    const correctCounts =
      getTargetCounts();

    const correct =
      values.every(
        value =>
          counts[value] ===
          correctCounts[value]
      );


    if (
      correct
    ) {

      feedback.className =
        "feedback correct";

      feedback.innerHTML =
        `
          <strong>
            ✓ Correct!
          </strong>

          ${targetNumber.toLocaleString(
            "en-US"
          )}

          is written correctly
          as an Egyptian numeral.
        `;

      return;
    }


    feedback.className =
      "feedback incorrect";

    feedback.innerHTML =
      `
        <div class="feedback-head">

          <strong>
            Not quite.
          </strong>

          Check how many symbols
          you need for each value.

        </div>

        ${buildExplanation()}
      `;
  }


  function newQuestion() {

    let number;

    do {

      number =
        generateNumber();

    } while (
      number ===
      previousNumber
    );


    previousNumber =
      number;

    targetNumber =
      number;


    values.forEach(
      value => {
        counts[value] = 0;
      }
    );


    history = [];


    problemNumber.textContent =
      targetNumber.toLocaleString(
        "en-US"
      );


    clearFeedback();

    renderAnswer();
  }


  undoButton.addEventListener(
    "click",
    undoLastSymbol
  );


  clearButton.addEventListener(
    "click",
    clearAnswer
  );


  checkButton.addEventListener(
    "click",
    checkAnswer
  );


  nextButton.addEventListener(
    "click",
    newQuestion
  );


  renderSymbolButtons();

  newQuestion();

})();
</script>

</body>
</html>
